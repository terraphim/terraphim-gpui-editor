name: Sign Mac App Store package

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique positive build number for App Store Connect
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    environment: mac-app-store-signing
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Apple Silicon editor
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin --bin terraphim-gpui-editor
      - name: Build sandboxed Store-signed package
        env:
          MAC_STORE_APP_P12_BASE64: ${{ secrets.MAC_STORE_APP_P12_BASE64 }}
          MAC_STORE_APP_P12_PASSWORD: ${{ secrets.MAC_STORE_APP_P12_PASSWORD }}
          MAC_STORE_INSTALLER_P12_BASE64: ${{ secrets.MAC_STORE_INSTALLER_P12_BASE64 }}
          MAC_STORE_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_STORE_INSTALLER_P12_PASSWORD }}
          MAC_STORE_PROFILE_BASE64: ${{ secrets.MAC_STORE_PROFILE_BASE64 }}
          MAC_STORE_BUNDLE_ID: ${{ vars.MAC_STORE_BUNDLE_ID }}
          MAC_STORE_TEAM_ID: ${{ vars.MAC_STORE_TEAM_ID }}
          MAC_STORE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          bash packaging/macos/sign-store.sh \
            target/aarch64-apple-darwin/release/terraphim-gpui-editor \
            signed-mac-store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraphim-editor-mac-app-store-signed
          path: signed-mac-store/
          if-no-files-found: error
