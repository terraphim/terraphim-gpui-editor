[package]
name = "terraphim-gpui-editor"
version = "0.1.0"
edition = "2021"
description = "GPUI-based desktop editor with Terraphim autocomplete and slash commands"
authors = ["Terraphim Contributors"]
license = "Apache-2.0"

[features]
# Test-only FastGPUI debug protocol adapter for the shipped GPUI core.
gdp = ["gpui/test-support"]

[dependencies]
# GPUI framework
gpui = "0.2"

# UI components with completion support
gpui-component = "=0.5.0-preview2"
gpui-component-assets = "=0.5.0-preview2"

# Terraphim autocomplete
terraphim_automata = "=2.1.0"
terraphim_types = "=1.22.3"
terraphim-markdown-parser = "=1.20.5"
terraphim_alternatives = "=0.1.1"
terraphim_lsp_core = "=1.23.1"
markdown = "1.0.0"

# LSP types for completion items (must match gpui-component's version)
lsp-types = "0.97"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Async
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Compile Metal shaders at runtime so builds need no separate Xcode Metal Toolchain.
gpui = { version = "0.2", features = ["runtime_shaders"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow"] }
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }
indoc = "2"
# criterion = "0.5"  # Uncomment when adding benchmarks

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
